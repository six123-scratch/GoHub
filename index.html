<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoHub</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;--card:#f2f2f2;--line:#ddd;--red:#f00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:2;display:flex;gap:16px;align-items:center;padding:14px 5%;background:var(--bg);border-bottom:1px solid var(--line)}.logo{font-size:21px;font-weight:800;white-space:nowrap}.logo b{display:inline-grid;place-items:center;width:32px;height:23px;margin-right:7px;color:#fff;background:var(--red);border-radius:6px;font-size:12px}.search{display:flex;flex:1;max-width:680px;margin:auto}.search input{flex:1;padding:12px 16px;border:1px solid var(--line);border-right:0;border-radius:24px 0 0 24px;font-size:15px}.search button{width:62px;border:1px solid var(--line);border-radius:0 24px 24px 0;background:var(--card);font-size:18px;cursor:pointer}.layout{display:flex}.side{width:210px;min-height:calc(100vh - 64px);padding:18px 12px;border-right:1px solid var(--line)}.side button{display:block;width:100%;padding:13px;border:0;border-radius:9px;background:transparent;text-align:left;font-size:14px;cursor:pointer}.side button:hover{background:var(--card)}main{flex:1;padding:22px 4%}.chips{display:flex;gap:9px;overflow:auto;margin-bottom:25px}.chip{padding:9px 14px;border:0;border-radius:8px;background:var(--card);white-space:nowrap;cursor:pointer}.chip.active{color:#fff;background:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:25px 16px}.video{cursor:pointer}.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:linear-gradient(135deg,#29323c,#485563)}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:7px;bottom:7px;padding:4px;color:#fff;background:#000c;border-radius:4px;font-size:12px}.info{display:flex;gap:10px;padding-top:10px}.avatar{display:grid;place-items:center;flex:0 0 34px;height:34px;color:#fff;background:#6555d9;border-radius:50%;font-size:11px}.info h3{margin:0 0 6px;font-size:15px;line-height:1.3}.info p{margin:3px 0;color:var(--muted);font-size:13px}.status{padding:45px 10px;color:var(--muted);text-align:center}@media(max-width:750px){.side{display:none}.top{padding:12px}.logo{font-size:17px}.search{max-width:none}main{padding:18px 12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="logo"><b>▶</b>VideoHub</div><div class="search"><input id="q" placeholder="Cari video YouTube..."><button id="go">⌕</button></div></header>
<div class="layout"><aside class="side"><button>⌂ Beranda</button><button>▣ Shorts</button><button>▤ Subscription</button><hr><button>◴ Histori</button><button>♡ Video disukai</button><hr><button>♬ Musik</button><button>⌁ Live</button></aside><main><nav class="chips" id="chips"></nav><h2 id="heading">Cari video dari YouTube</h2><div id="status" class="status">Masukkan kata pencarian, misalnya “musik Indonesia”.</div><section id="grid" class="grid"></section></main></div>
<script>
// Tempel API key BARU milikmu di bawah ini. Jangan unggah file ini ke GitHub.
const YOUTUBE_API_KEY = "TEMPEL_KEY_BARU_DI_SINI";
const categories=["Semua","Musik","Gaming","Berita","Live","Tutorial","Podcast","Desain"];
const chips=document.querySelector('#chips'),q=document.querySelector('#q'),grid=document.querySelector('#grid'),status=document.querySelector('#status');
chips.innerHTML=categories.map((x,i)=>`<button class="chip ${i?'':'active'}" data-q="${x==='Semua'?'':x}">${x}</button>`).join('');
chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;b.click;search(b.dataset.q)});
async function search(keyword){
  if(!keyword.trim()){grid.innerHTML='';status.textContent='Masukkan kata pencarian, misalnya “musik Indonesia”.';status.style.display='block';return}
  if(YOUTUBE_API_KEY.includes('TEMPEL')){status.textContent='Isi API key di kode terlebih dahulu, lalu coba cari lagi.';status.style.display='block';return}
  status.textContent='Sedang mencari video...';status.style.display='block';grid.innerHTML='';
  try{
    const url='https://www.googleapis.com/youtube/v3/search?'+new URLSearchParams({part:'snippet',type:'video',maxResults:'12',q:keyword,key:YOUTUBE_API_KEY});
    const res=await fetch(url),data=await res.json();
    if(data.error)throw new Error(data.error.message);
    status.style.display=data.items.length?'none':'block';status.textContent='Video tidak ditemukan.';
    grid.innerHTML=data.items.map(v=>`<article class="video" onclick="openVideo('${v.id.videoId}')"><div class="thumb"><img src="${v.snippet.thumbnails.high.url}" alt=""><span class="duration">YouTube</span></div><div class="info"><div class="avatar">YT</div><div><h3>${escapeHtml(v.snippet.title)}</h3><p>${escapeHtml(v.snippet.channelTitle)}</p><p>Video YouTube</p></div></div></article>`).join('');
  }catch(e){status.style.display='block';status.textContent='Gagal: '+e.message;}
}
function openVideo(id){window.open('https://www.youtube.com/watch?v='+id,'_blank')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
document.querySelector('#go').onclick=()=>search(q.value);q.addEventListener('keydown',e=>{if(e.key==='Enter')search(q.value)});
</script>
</body></html>
