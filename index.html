<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoHub - Nonton Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #0f0f0f; color: white; }
    
    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 24px; background-color: #0f0f0f;
      border-bottom: 1px solid #272727; position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 22px; font-weight: bold; color: white; display: flex; align-items: center; gap: 6px; }
    .logo span { background: #ff0000; color: white; padding: 2px 8px; border-radius: 6px; font-size: 16px; }
    .search-box { display: flex; width: 45%; max-width: 500px; }
    .search-box input {
      width: 100%; padding: 8px 16px; border-radius: 20px 0 0 20px;
      border: 1px solid #303030; background: #121212; color: white; outline: none;
    }
    .search-box button {
      padding: 8px 18px; border-radius: 0 20px 20px 0;
      border: 1px solid #303030; background: #222222; color: white; cursor: pointer;
    }

    /* Konten Utama */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    
    /* Pemutar Video */
    .player-section { margin-bottom: 30px; }
    .video-frame {
      width: 100%; aspect-ratio: 16 / 9; max-height: 540px;
      border-radius: 12px; border: none; background: #000;
    }
    .video-title { font-size: 20px; font-weight: bold; margin-top: 12px; }
    .video-channel { color: #aaaaaa; font-size: 14px; margin-top: 6px; }

    /* Daftar Video */
    h3 { margin-bottom: 16px; font-size: 18px; }
    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px;
    }
    .card { cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: scale(1.02); }
    .thumb {
      width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
      border-radius: 10px; background: #272727;
    }
    .card-title { font-size: 15px; font-weight: bold; margin-top: 8px; line-height: 1.3; }
    .card-meta { font-size: 13px; color: #aaaaaa; margin-top: 4px; }
  </style>
</head>
<body>

  <header>
    <div class="logo"><span>▶</span> GoHub</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari video..." onkeyup="filterVideos()">
      <button onclick="filterVideos()">Cari</button>
    </div>
    <div>Akun</div>
  </header>

  <div class="container">
    <div class="player-section">
      <iframe id="mainPlayer" class="video-frame" 
        src="https://youtube.com" 
        allowfullscreen>
      </iframe>
      <div class="video-title" id="mainTitle">Lofi Hip Hop Radio - Beats to Relax/Study to</div>
      <div class="video-channel" id="mainChannel">Lofi Girl • Sedang Diputar</div>
    </div>

    <h3>Rekomendasi Video</h3>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <script>
    const videos = [
      {
        id: "jfKfPfyJRdk",
        title: "Lofi Hip Hop Radio - Beats to Relax/Study to",
        channel: "Lofi Girl"
      },
      {
        id: "aqz-KE-bpKQ",
        title: "Big Buck Bunny 60fps 4K - Short Film",
        channel: "Blender"
      },
      {
        id: "LXb3EKWsInQ",
        title: "COSTA RICA IN 4K 60fps HDR (Ultra HD)",
        channel: "Jacob + Katie Schwarz"
      },
      {
        id: "eRsGyueVLvQ",
        title: "Sintel - Open Movie by Blender Foundation",
        channel: "Blender"
      }
    ];

    const grid = document.getElementById("videoGrid");

    function renderVideos(list) {
      grid.innerHTML = "";
      list.forEach(video => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img class="thumb" src="https://youtube.com{video.id}/hqdefault.jpg" alt="${video.title}">
          <div class="card-title">${video.title}</div>
          <div class="card-meta">${video.channel}</div>
        `;
        card.onclick = () => {
          document.getElementById("mainPlayer").src = `https://youtube.com{video.id}?autoplay=1`;
          document.getElementById("mainTitle").innerText = video.title;
          document.getElementById("mainChannel").innerText = video.channel + " • Sedang Diputar";
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        grid.appendChild(card);
      });
    }

    function filterVideos() {
      const keyword = document.getElementById("searchInput").value.toLowerCase();
      const filtered = videos.filter(v => v.title.toLowerCase().includes(keyword));
      renderVideos(filtered);
    }

    renderVideos(videos);
  </script>

</body>
</html>
